[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "dataconv-native"
description = "Native (Rust) engine for dataconv: parallel lossless conversion and compression"
readme = "README.md"
requires-python = ">=3.9"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.md"]
authors = [{ name = "Srinjoy Ghosh" }]
dynamic = ["version"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Archiving :: Compression",
]

[tool.maturin]
module-name = "dataconv_native"
features = ["pyo3/extension-module"]
strip = true

[tool.maturin.sbom]
# no SBOM generated from cargo metadata: it names local crates by their path on disk
rust = false
