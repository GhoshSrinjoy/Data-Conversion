[package]
name = "vegg-python"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "vegg_python"
crate-type = ["cdylib"]

[dependencies]
vegg-core = { path = "../core" }
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }
serde = "1"
serde_json = "1"
mimalloc = { version = "0.1.52", default-features = false }
