[package]
name = "dataconv-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Standalone dataconv binary: lossless data conversion and compression without Python"

[[bin]]
name = "dataconv"
path = "src/main.rs"

[dependencies]
dataconv-core = { path = "../core" }
serde_json = "1"
ctrlc = "3.4"
