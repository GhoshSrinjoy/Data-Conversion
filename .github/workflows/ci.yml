name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-latest]
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  msrv:
    name: Rust 1.88 (minimum supported)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - run: cargo check --workspace --locked

  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.11", "3.13", "3.14"]
        include:
          - os: ubuntu-22.04
            python: "3.8"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install the package
        run: python -m pip install -e ".[dev]"
      - name: Lint
        if: matrix.python == '3.14'
        run: ruff check .
      - name: Tests, pure Python only
        run: python -m pytest -q
        env:
          DATACONV_DISABLE: all
      - name: Install pyarrow and codecs
        run: python -m pip install pyarrow numpy zstandard lz4 brotli psutil openpyxl
      - name: Tests, pyarrow engine
        run: python -m pytest -q
        env:
          DATACONV_DISABLE: dataconv_native
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.python != '3.8'
      - uses: Swatinem/rust-cache@v2
        if: matrix.python != '3.8'
        with:
          workspaces: native
      - name: Build the native engine
        if: matrix.python != '3.8'
        run: python -m pip install ./native/python
      - name: Tests, all engines
        if: matrix.python != '3.8'
        run: python -m pytest -q
