name: Release builds

# Builds the distributable artifacts: the pure-Python package, abi3 wheels of the
# native engine for every major platform, and standalone binaries. Publishing is
# left to the maintainer (download the artifacts from the run).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: dataconv (sdist and wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dataconv-package
          path: dist/*

  native-wheels:
    name: dataconv-native (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { os: ubuntu-latest, target: aarch64, manylinux: auto }
          - { os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { os: ubuntu-latest, target: aarch64, manylinux: musllinux_1_2 }
          - { os: macos-latest, target: x86_64, manylinux: "off" }
          - { os: macos-latest, target: aarch64, manylinux: "off" }
          - { os: windows-latest, target: x64, manylinux: "off" }
          - { os: windows-latest, target: aarch64, manylinux: "off" }
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          working-directory: native/python
          args: --release --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux }}
          path: native/python/dist/*.whl

  binaries:
    name: dataconv binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-latest, target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross-compilation tools
        if: contains(matrix.target, 'linux')
        run: cargo install cross --locked
      - name: Build
        shell: bash
        working-directory: native
        run: |
          if [[ "${{ matrix.target }}" == *linux* ]]; then
            cross build --release -p dataconv-cli --target ${{ matrix.target }}
          else
            cargo build --release -p dataconv-cli --target ${{ matrix.target }}
          fi
      - name: Package
        shell: bash
        run: |
          mkdir -p out
          bin=native/target/${{ matrix.target }}/release/dataconv
          [ -f "$bin.exe" ] && bin="$bin.exe"
          cp "$bin" LICENSE native/THIRD_PARTY_LICENSES.md out/
          tar -czf dataconv-${{ matrix.target }}.tar.gz -C out .
      - uses: actions/upload-artifact@v7
        with:
          name: dataconv-${{ matrix.target }}
          path: dataconv-${{ matrix.target }}.tar.gz
